name: One-time archive progressive reveal patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/archive-progressive-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch live archive behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = "const PROFILE_PAGE_SIZE=12;\nconst ARCHIVE_INITIAL=24;\nlet profileScope=null, profileLimit=PROFILE_PAGE_SIZE, profileQuery='', archiveExpanded=false;"
          new = "const PROFILE_PAGE_SIZE=12;\nconst ARCHIVE_INITIAL=6;\nconst ARCHIVE_PAGE_SIZE=10;\nlet profileScope=null, profileLimit=PROFILE_PAGE_SIZE, profileQuery='', archiveLimit=ARCHIVE_INITIAL;"
          if old not in s:
              raise SystemExit('Archive constants/state target not found')
          s = s.replace(old, new, 1)

          old = "function applyArchive(){const events=[...document.querySelectorAll('#events .event')];const tools=document.querySelector('[data-archive-tools]');const more=document.querySelector('[data-archive-more]');if(!tools||!more)return;const large=events.length>ARCHIVE_INITIAL;tools.hidden=!large;events.forEach((card,i)=>{card.hidden=large&&!archiveExpanded&&i>=ARCHIVE_INITIAL;});more.textContent=archiveExpanded?'Show newest only':`Show older tournaments · ${Math.max(0,events.length-ARCHIVE_INITIAL)} more`; }"
          new = "function applyArchive(){const events=[...document.querySelectorAll('#events .event')];const tools=document.querySelector('[data-archive-tools]');const more=document.querySelector('[data-archive-more]');if(!tools||!more)return;const large=events.length>ARCHIVE_INITIAL;tools.hidden=!large;const visible=Math.min(archiveLimit,events.length);events.forEach((card,i)=>{card.hidden=large&&i>=visible;});const remaining=Math.max(0,events.length-visible);more.hidden=!large||remaining===0;if(remaining>0){const step=Math.min(ARCHIVE_PAGE_SIZE,remaining);more.textContent=`Show ${step} more tournament${step===1?'':'s'} · ${remaining} remaining`;}}"
          if old not in s:
              raise SystemExit('Archive applyArchive target not found')
          s = s.replace(old, new, 1)

          old = "if(archiveMore){archiveExpanded=!archiveExpanded;applyArchive();if(!archiveExpanded)document.querySelector('#events')?.scrollIntoView({behavior:'smooth',block:'start'});return;}"
          new = "if(archiveMore){archiveLimit+=ARCHIVE_PAGE_SIZE;applyArchive();return;}"
          if old not in s:
              raise SystemExit('Archive click target not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Verify and publish
        run: |
          grep -q 'ARCHIVE_INITIAL=6' index.html
          grep -q 'ARCHIVE_PAGE_SIZE=10' index.html
          git config user.name "high-loft-ui-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Show six archive events then ten more at a time"
          git push origin HEAD:main
