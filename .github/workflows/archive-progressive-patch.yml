# One-time archive patch against current scalable UI
name: One-time archive progressive reveal patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/archive-progressive-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch live archive behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = "  const ARCHIVE_INITIAL=24;\n  const SEASON_BOARD_VISIBLE=15;\n  let profileVisible=PROFILE_PAGE_SIZE;\n  let archiveExpanded=false;"
          new = "  const ARCHIVE_INITIAL=6;\n  const ARCHIVE_PAGE_SIZE=10;\n  const SEASON_BOARD_VISIBLE=15;\n  let profileVisible=PROFILE_PAGE_SIZE;\n  let archiveVisible=ARCHIVE_INITIAL;"
          if old not in s: raise SystemExit('Current archive constants/state target not found')
          s = s.replace(old, new, 1)
          old = "    const total=cards.length;\n    const large=total>ARCHIVE_INITIAL;\n    footer.hidden=!large;\n    cards.forEach((card,i)=>card.hidden=large&&!archiveExpanded&&i>=ARCHIVE_INITIAL);\n    if(large)button.textContent=archiveExpanded?'Show fewer tournaments':`Show older tournaments · ${total-ARCHIVE_INITIAL} more`;"
          new = "    const total=cards.length;\n    const large=total>ARCHIVE_INITIAL;\n    const visible=Math.min(archiveVisible,total);\n    cards.forEach((card,i)=>card.hidden=large&&i>=visible);\n    const remaining=Math.max(0,total-visible);\n    footer.hidden=!large||remaining===0;\n    if(remaining>0){\n      const step=Math.min(ARCHIVE_PAGE_SIZE,remaining);\n      button.textContent='Show '+step+' more tournament'+(step===1?'':'s')+' · '+remaining+' remaining';\n    }"
          if old not in s: raise SystemExit('Current archive body target not found')
          s = s.replace(old, new, 1)
          old = "    if(e.target.closest('[data-archive-more]')){archiveExpanded=!archiveExpanded;applyArchive();return;}"
          new = "    if(e.target.closest('[data-archive-more]')){archiveVisible+=ARCHIVE_PAGE_SIZE;applyArchive();return;}"
          if old not in s: raise SystemExit('Current archive click target not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Verify and publish
        run: |
          grep -q 'ARCHIVE_INITIAL=6' index.html
          grep -q 'ARCHIVE_PAGE_SIZE=10' index.html
          grep -q 'archiveVisible+=ARCHIVE_PAGE_SIZE' index.html
          git config user.name "high-loft-ui-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Show six archive events then ten more at a time"
          git push origin HEAD:main
