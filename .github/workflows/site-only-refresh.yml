name: Site-only presentation refresh

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/site-only-refresh.yml"
  workflow_dispatch:

concurrency:
  group: high-loft-automated-publisher
  cancel-in-progress: false

jobs:
  refresh-presentation:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out current production site
        uses: actions/checkout@v4
        with:
          ref: main
          path: production
          fetch-depth: 0

      - name: Verify current production target
        run: |
          test "$(cat production/.automation/last-published-event.txt)" = "66943" || (echo "Production marker is no longer 66943; refusing one-off refresh" && exit 1)
          test -f production/recaps/par-3-canyon-run-scratch-tournament.html || (echo "Current Canyon recap is missing" && exit 1)

      - name: Open first row and tighten collapsed cards
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path('production/recaps/par-3-canyon-run-scratch-tournament.html')
          html = path.read_text()

          css_replacements = {
              '.hole-card{padding:18px 20px}': '.hole-card{padding:12px 16px}\n.hole-card.is-open{padding:18px 20px}',
              '.hole-card>p{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;margin-bottom:0}': '.hole-card>p{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:1;overflow:hidden;margin:6px 0 0}',
              '.hole-card.is-open>p{display:block;-webkit-line-clamp:unset;overflow:visible}': '.hole-card.is-open>p{display:block;-webkit-line-clamp:unset;overflow:visible;margin-top:12px}',
              '.recap-players article{padding:18px 20px}': '.recap-players article{padding:12px 16px;min-height:0}\n.recap-players article.is-open{padding:18px 20px}',
              '.recap-expand{margin-top:12px}': '.recap-players .player-roast{margin-bottom:8px}\n.recap-expand{margin-top:8px}\n.is-open .recap-expand{margin-top:12px}',
              'padding:9px 12px;font:inherit;font-size:10px': 'padding:8px 11px;font:inherit;font-size:10px',
          }
          for old, new in css_replacements.items():
              if old in html:
                  html = html.replace(old, new, 1)

          # Open the first two Carnage cards.
          carnage_seen = 0
          def open_carnage(m):
              global carnage_seen
              card = m.group(0)
              if carnage_seen < 2:
                  card = re.sub(r'<article data-carnage-card class="([^"]*)">', lambda x: f'<article data-carnage-card class="{x.group(1)} is-open">', card, count=1)
                  card = card.replace('data-carnage-expand aria-expanded="false">Open crime scene <span>+</span>', 'data-carnage-expand aria-expanded="true">Close crime scene <span>−</span>', 1)
              carnage_seen += 1
              return card
          html = re.sub(r'<article data-carnage-card .*?</article>', open_carnage, html, flags=re.S)

          # Open the first two Player-by-Player cards.
          player_seen = 0
          def open_player(m):
              global player_seen
              card = m.group(0)
              if player_seen < 2:
                  card = card.replace('<article data-player-card>', '<article data-player-card class="is-open">', 1)
                  card = card.replace('<div class="round-details" hidden>', '<div class="round-details">', 1)
                  card = card.replace('data-player-expand aria-expanded="false">Read full breakdown <span>+</span>', 'data-player-expand aria-expanded="true">Close breakdown <span>−</span>', 1)
              player_seen += 1
              return card
          html = re.sub(r'<article data-player-card.*?</article>', open_player, html, flags=re.S)

          assert html.count('data-player-expand aria-expanded="true"') >= 2
          assert html.count('data-carnage-expand aria-expanded="true"') >= 2
          assert '.recap-players article{padding:12px 16px;min-height:0}' in html
          assert '.hole-card{padding:12px 16px}' in html

          path.write_text(html)
          print('Opened first two Player and Carnage cards; tightened collapsed state')
          PY

      - name: Publish presentation-only refresh
        working-directory: production
        run: |
          git config user.name "high-loft-auto-bot"
          git config user.email "actions@users.noreply.github.com"
          git add recaps/par-3-canyon-run-scratch-tournament.html
          if git diff --cached --quiet; then
            echo "No presentation changes to publish."
          else
            git commit -m "Open first recap row and tighten collapsed cards"
            git push origin HEAD:main
          fi

      - name: Confirm marker unchanged
        working-directory: production
        run: |
          test "$(cat .automation/last-published-event.txt)" = "66943"
          echo "Current recap refreshed. Event marker unchanged; Discord not touched."
