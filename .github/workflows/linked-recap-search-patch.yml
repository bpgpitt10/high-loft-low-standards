name: One-time linked recap search patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/linked-recap-search-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch published recaps
        run: python tools/patch_linked_recap_search.py
      - name: Validate linked recap search
        run: |
          python -m py_compile tools/patch_linked_recap_search.py
          ! grep -R -q '<span>Search player</span>' recaps
          grep -R -q 'recap-linked-search-runtime' recaps
      - name: Publish recap search update
        run: |
          git config user.name "high-loft-ui-bot"
          git config user.email "actions@users.noreply.github.com"
          git add recaps/
          git commit -m "Link tournament player searches"
          git push origin HEAD:main
