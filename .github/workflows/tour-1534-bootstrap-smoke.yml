name: Tour 1534 generic bootstrap smoke

on:
  push:
    branches:
      - event-queue-publisher-v1
    paths:
      - ".github/workflows/tour-1534-bootstrap-smoke.yml"

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out production test branch
        uses: actions/checkout@v4
        with:
          ref: event-queue-publisher-v1
          path: production

      - name: Check out engine onboarding branch
        uses: actions/checkout@v4
        with:
          repository: bpgpitt10/sgt-recap-engine-lab
          ref: generic-onboarding-v1
          path: engine

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install engine dependencies
        working-directory: engine
        run: python -m pip install -r requirements.txt

      - name: Compile latest generic onboarding code
        working-directory: engine
        run: |
          python -m py_compile \
            src/discover.py src/build_history.py src/process_tour.py src/event_queue.py \
            src/render_site.py src/write_recap.py src/write_recap_batched.py \
            src/run_batched_recap.py src/write_league_copy_batched.py src/run_batched_league_copy.py

      - name: Build isolated Tour 1534 deterministic history
        working-directory: engine
        run: python src/process_tour.py --config configs/tour-1534.json --data-root data/leagues/tour-1534

      - name: Require OpenAI key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$OPENAI_API_KEY" || (echo "OPENAI_API_KEY missing" && exit 1)

      - name: Generate generic batched league profiles
        working-directory: engine
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.4-mini-2026-03-17
          OPENAI_FALLBACK_MODEL: gpt-5.6-luna
          OPENAI_TRANSIENT_ATTEMPTS: "6"
          OPENAI_REQUEST_TIMEOUT_SECONDS: "120"
        run: |
          python src/run_batched_league_copy.py data/leagues/tour-1534/history.json \
            --output data/leagues/tour-1534/league-copy.json \
            --facts-output data/leagues/tour-1534/league-facts.json \
            --checkpoint-dir data/leagues/tour-1534/ai-checkpoints/league \
            --batch-size 6

      - name: Generate generic latest tournament recap
        working-directory: engine
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.4-mini-2026-03-17
          OPENAI_FALLBACK_MODEL: gpt-5.6-luna
          OPENAI_TRANSIENT_ATTEMPTS: "6"
          OPENAI_REQUEST_TIMEOUT_SECONDS: "120"
        run: |
          LATEST=$(python - <<'PY'
          import json
          print(json.load(open('data/leagues/tour-1534/history.json'))['completedEvents'][0]['id'])
          PY
          )
          echo "LATEST=$LATEST" >> "$GITHUB_ENV"
          mkdir -p data/leagues/tour-1534/copy data/leagues/tour-1534/facts
          python src/run_batched_recap.py "data/leagues/tour-1534/analysis/$LATEST.json" \
            --history data/leagues/tour-1534/history.json \
            --config configs/tour-1534.json \
            --output "data/leagues/tour-1534/copy/$LATEST.json" \
            --facts-output "data/leagues/tour-1534/facts/$LATEST.json" \
            --checkpoint-dir data/leagues/tour-1534/ai-checkpoints/recap \
            --batch-size 6

      - name: Render branded generic site
        working-directory: engine
        run: |
          python src/render_site.py \
            --config configs/tour-1534.json \
            --data-root data/leagues/tour-1534 \
            --output site-tour-1534

      - name: Validate second-league site
        working-directory: engine
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root=Path('site-tour-1534')
          index=(root/'index.html').read_text()
          history=json.loads(Path('data/leagues/tour-1534/history.json').read_text())
          latest=str(history['completedEvents'][0]['id'])
          recap=(root/'recaps'/f'{latest}.html').read_text()

          assert "CRUSH'S PAR3" in index, 'configured league brand missing'
          assert 'HIGH LOFT' not in index.upper(), 'High Loft brand leaked into generic landing'
          assert 'HIGH LOFT' not in recap.upper(), 'High Loft brand leaked into generic recap'
          assert (root/'recaps'/f'{latest}.html').exists()
          assert len(history['scopes']['all']['players']) >= 70
          league_copy=json.loads(Path('data/leagues/tour-1534/league-copy.json').read_text())
          assert len(league_copy['scopes']['all']['profiles']) == len(history['scopes']['all']['players'])
          recap_copy=json.loads(Path(f'data/leagues/tour-1534/copy/{latest}.json').read_text())
          completed=sum(1 for p in json.loads(Path(f'data/leagues/tour-1534/analysis/{latest}.json').read_text())['players'] if p.get('completed'))
          assert len(recap_copy['players']) == completed
          assert len(recap_copy['carnage']) == completed
          print('GENERIC BOOTSTRAP PASSED')
          print(json.dumps({
            'latestEventId': int(latest),
            'completedEvents': len(history['completedEvents']),
            'allDataPlayers': len(history['scopes']['all']['players']),
            'latestFinishers': completed,
            'profileCopyCount': len(league_copy['scopes']['all']['profiles']),
            'recapPlayerCount': len(recap_copy['players'])
          },indent=2))
          PY

      - name: Upload Tour 1534 site artifact
        uses: actions/upload-artifact@v4
        with:
          name: tour-1534-generic-site
          path: |
            engine/site-tour-1534/
            engine/data/leagues/tour-1534/history.json
            engine/data/leagues/tour-1534/league-copy.json
            engine/data/leagues/tour-1534/copy/
          if-no-files-found: error
# trigger
