# Branch-only validation workflow for scalable recap/landing UI.
name: Large-field UI branch test

on:
  push:
    branches: [large-field-ui-v1]
    paths:
      - ".github/workflows/large-field-ui-preview.yml"

jobs:
  test-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Check out production UI branch
        uses: actions/checkout@v4
        with:
          ref: large-field-ui-v1
          path: production
          fetch-depth: 0

      - name: Check out engine UI branch
        uses: actions/checkout@v4
        with:
          repository: bpgpitt10/sgt-recap-engine-lab
          ref: large-field-ui-v1
          path: engine

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply large-field layer to current production HTML
        run: |
          mkdir -p preview/recaps
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('engine/src').resolve()))
          import render_high_loft_large_field as ui

          index = Path('production/index.html').read_text()
          recap = Path('production/recaps/week-1-trosper-golf-club.html').read_text()
          Path('preview/index.html').write_text(ui.large_field_landing(index))
          Path('preview/recaps/week-1-trosper-golf-club.html').write_text(ui.large_field_recap(recap))
          print('Applied large-field layer to current production HTML')
          PY

      - name: Static assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          index = Path('preview/index.html').read_text()
          recap = Path('preview/recaps/week-1-trosper-golf-club.html').read_text()
          for marker in ['data-profile-search','data-profile-more','data-season-scroll-note','data-archive-more']:
              assert marker in index, marker
          for marker in ['data-round-player-search','data-round-player-more','data-carnage-more','data-round-player-grid','data-carnage-grid']:
              assert marker in recap, marker
          assert 'PROFILE_PAGE_SIZE=12' in index
          assert 'CARNAGE_INITIAL=10' in recap
          assert 'PLAYER_PAGE_SIZE=10' in recap
          print('Static large-field markers passed')
          PY

      - name: Set up DOM test dependency
        run: npm install --no-save jsdom@26

      - name: Execute browser behavior tests
        run: |
          node <<'JS'
          const fs = require('fs');
          const {JSDOM} = require('jsdom');

          function evalInline(dom) {
            for (const script of [...dom.window.document.querySelectorAll('script')]) {
              if (script.src) continue;
              dom.window.eval(script.textContent);
            }
          }
          function visible(nodes) {
            return [...nodes].filter(n => !n.hidden);
          }
          function fire(window, el, type) {
            el.dispatchEvent(new window.Event(type, {bubbles:true}));
          }

          const landingHtml = fs.readFileSync('preview/index.html','utf8');
          const landing = new JSDOM(landingHtml,{runScripts:'outside-only',url:'https://example.test/'});
          evalInline(landing);
          setTimeout(() => {
            const d = landing.window.document;
            const cards = d.querySelectorAll('.scouting-card');
            if (cards.length <= 12) throw new Error(`Expected >12 scouting cards, got ${cards.length}`);
            if (d.querySelector('[data-profile-tools]').hidden) throw new Error('Scouting tools should be visible');
            if (visible(cards).length !== 12) throw new Error(`Expected 12 visible scouting cards, got ${visible(cards).length}`);
            const search = d.querySelector('[data-profile-search]');
            search.value='MashedBROtato';
            fire(landing.window, search, 'input');
            if (visible(cards).length !== 1) throw new Error(`Profile search expected one result, got ${visible(cards).length}`);

            const recapHtml = fs.readFileSync('preview/recaps/week-1-trosper-golf-club.html','utf8');
            const recap = new JSDOM(recapHtml,{runScripts:'outside-only',url:'https://example.test/recap'});
            const rd = recap.window.document;
            const pg = rd.querySelector('[data-round-player-grid]');
            const cg = rd.querySelector('[data-carnage-grid]');
            const originalPlayers=[...pg.querySelectorAll('[data-player-card]')];
            const originalCarnage=[...cg.querySelectorAll('[data-carnage-card]')];
            for(let i=originalPlayers.length;i<45;i++){
              const clone=originalPlayers[i%originalPlayers.length].cloneNode(true);
              const h3=clone.querySelector('h3');
              h3.firstChild.textContent=`Synthetic${i+1} `;
              pg.appendChild(clone);
            }
            for(let i=originalCarnage.length;i<45;i++){
              const clone=originalCarnage[i%originalCarnage.length].cloneNode(true);
              const name=clone.querySelector('.player-name');
              if(name) name.textContent=`Synthetic${i+1}`;
              cg.appendChild(clone);
            }
            evalInline(recap);
            const playerCards=rd.querySelectorAll('[data-player-card]');
            const carnageCards=rd.querySelectorAll('[data-carnage-card]');
            if (visible(playerCards).length !== 10) throw new Error(`Expected 10 visible recap players, got ${visible(playerCards).length}`);
            if (visible(carnageCards).length !== 10) throw new Error(`Expected 10 visible Carnage cards, got ${visible(carnageCards).length}`);
            if (rd.querySelector('[data-round-player-tools]').hidden) throw new Error('Round player tools should be visible for 45 players');
            if (rd.querySelector('[data-carnage-tools]').hidden) throw new Error('Carnage tools should be visible for 45 players');
            const roundSearch=rd.querySelector('[data-round-player-search]');
            roundSearch.value='Synthetic45';
            fire(recap.window, roundSearch, 'input');
            if (visible(playerCards).length !== 1) throw new Error(`Round search expected one result, got ${visible(playerCards).length}`);
            roundSearch.value='';
            fire(recap.window, roundSearch, 'input');
            rd.querySelector('[data-round-player-more]').click();
            if (visible(playerCards).length !== 20) throw new Error(`Show-more expected 20 players, got ${visible(playerCards).length}`);
            rd.querySelector('[data-carnage-more]').click();
            if (visible(carnageCards).length !== 45) throw new Error(`Carnage reveal expected 45 cards, got ${visible(carnageCards).length}`);
            console.log('DOM behavior passed for synthetic 45-player field');
          }, 25);
          JS

      - name: Save generated preview on UI branch
        run: |
          cp preview/index.html production/index.html
          cp preview/recaps/week-1-trosper-golf-club.html production/recaps/week-1-trosper-golf-club.html
          git -C production config user.name "sgt-recap-engine-bot"
          git -C production config user.email "actions@users.noreply.github.com"
          git -C production add index.html recaps/week-1-trosper-golf-club.html
          if git -C production diff --cached --quiet; then
            echo "Preview output unchanged."
            exit 0
          fi
          git -C production commit -m "Render large-field UI preview"
          git -C production push origin HEAD:large-field-ui-v1
