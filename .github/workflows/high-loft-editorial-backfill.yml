name: High Loft editorial archive backfill

on:
  workflow_dispatch:

concurrency:
  group: high-loft-editorial-backfill
  cancel-in-progress: false

jobs:
  rewrite-archive:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out current High Loft production site
        uses: actions/checkout@v4
        with:
          ref: main
          path: production
          fetch-depth: 0

      - name: Check out recap engine
        uses: actions/checkout@v4
        with:
          repository: bpgpitt10/sgt-recap-engine-lab
          ref: main
          path: engine

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install engine dependencies
        run: python -m pip install -r engine/requirements.txt

      - name: Rebuild deterministic High Loft history
        working-directory: engine
        run: python src/process_tour.py

      - name: Rewrite archive with High Loft editorial rules
        working-directory: engine
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
        run: python src/backfill_high_loft_archive_safe.py --production-root ../production --output site-high-loft-backfill

      - name: Validate backfill before publication
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('engine')
          site = root / 'site-high-loft-backfill'
          history = json.loads((root / 'data/history.json').read_text())
          cfg = json.loads((root / 'config.json').read_text())
          completed = history['completedEvents']
          excluded = {int(x['id']) for x in history.get('excludedProfileEvents', [])}
          configured_excluded = {int(x) for x in (cfg.get('history') or {}).get('excludeEventIds', [])}

          assert excluded == configured_excluded, f'History exclusions do not match config: {excluded} vs {configured_excluded}'
          assert (site / 'index.html').exists(), 'Missing rebuilt landing page'
          recaps = list((site / 'recaps').glob('*.html'))
          assert len(recaps) == len(completed), f'Expected {len(completed)} recap pages, got {len(recaps)}'

          for page in recaps:
              text = page.read_text()
              for required in ('Tournament leaderboard', 'data-board="net"', 'data-board="gross"', 'Carnage Board', 'Player by player', 'State of the league'):
                  assert required.lower() in text.lower(), f'{page.name} missing {required}'

          landing = (site / 'index.html').read_text()
          for required in ('League Snapshot', 'Scouting files', 'Tournament archive'):
              assert required.lower() in landing.lower(), f'Landing page missing {required}'

          print('EDITORIAL BACKFILL VALIDATION PASSED')
          print('Completed recaps rewritten:', len(recaps))
          print('Discord posting: DISABLED BY DESIGN')
          PY

      - name: Publish rewritten archive without Discord
        working-directory: production
        run: |
          cp ../engine/site-high-loft-backfill/index.html index.html
          cp ../engine/site-high-loft-backfill/recaps/*.html recaps/
          git config user.name "high-loft-auto-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html recaps/
          if git diff --cached --quiet; then
            echo "No editorial changes to publish."
            exit 0
          fi
          git commit -m "Refresh High Loft archive editorial copy"
          git push origin HEAD:main

      - name: Confirm no Discord action
        run: |
          echo "Archive editorial backfill complete."
          echo "No Discord webhook was called."
          echo "The .automation/last-published-event.txt marker was intentionally left unchanged."
