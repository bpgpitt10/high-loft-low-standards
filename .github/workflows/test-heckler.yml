name: Test The Heckler Bot

on:
  workflow_dispatch:

jobs:
  test-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Send disposable test message
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL is not configured."
            exit 1
          fi
          python - <<'PY'
          import json
          import os
          import urllib.request

          webhook = os.environ['DISCORD_WEBHOOK_URL']
          message = (
              "🤖 **The Heckler Bot is alive.**\n"
              "This is a disposable test post. No tournament was harmed in the making of this message."
          )
          payload = json.dumps({"content": message}).encode("utf-8")
          req = urllib.request.Request(
              webhook,
              data=payload,
              headers={"Content-Type": "application/json", "User-Agent": "the-heckler-bot"},
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              if response.status not in (200, 204):
                  raise RuntimeError(f"Discord webhook returned HTTP {response.status}")
          print("The Heckler Bot test post was sent successfully.")
          PY
