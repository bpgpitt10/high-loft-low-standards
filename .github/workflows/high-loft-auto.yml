name: High Loft automated publisher

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Rebuild even if no newly completed tournament exists"
        required: true
        type: boolean
        default: true
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: high-loft-automated-publisher
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Check out current High Loft production site
        uses: actions/checkout@v4
        with:
          ref: main
          path: production
          fetch-depth: 0

      - name: Check out recap engine
        uses: actions/checkout@v4
        with:
          repository: bpgpitt10/sgt-recap-engine-lab
          ref: main
          path: engine

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install engine dependencies
        run: python -m pip install -r engine/requirements.txt

      - name: Discover High Loft and rebuild deterministic history
        working-directory: engine
        run: python src/process_tour.py

      - name: Plan missing completed-event publication queue
        id: change
        env:
          FORCE_REBUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.force_rebuild || false }}
        run: |
          python engine/src/event_queue.py plan engine/data/history.json \
            --state production/.automation/published-events.json \
            --legacy-marker production/.automation/last-published-event.txt \
            --write-state \
            --output engine/data/publish-plan.json

          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path

          plan = json.loads(Path('engine/data/publish-plan.json').read_text())
          missing = [int(x) for x in plan['missingEventIdsOldestFirst']]
          latest = int(plan['latestCompletedEventId'])
          force = os.environ.get('FORCE_REBUILD','false').lower() == 'true'
          targets = missing[:] if missing else ([latest] if force else [])

          print(f"latest={latest}")
          print("missing=" + " ".join(str(x) for x in missing))
          print("targets=" + " ".join(str(x) for x in targets))
          print(f"queue_length={len(missing)}")
          print("rebuild=" + ("true" if targets else "false"))
          PY

          echo "Publication plan:"
          cat engine/data/publish-plan.json

      - name: Require OpenAI API key only when rebuilding
        if: steps.change.outputs.rebuild == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY is missing from the high-loft-low-standards repository secrets."
            exit 1
          fi

      - name: Write rolling League Snapshot and Scouting Files
        if: steps.change.outputs.rebuild == 'true'
        working-directory: engine
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.4-mini-2026-03-17
          OPENAI_FALLBACK_MODEL: gpt-5.6-luna
          OPENAI_TRANSIENT_ATTEMPTS: "6"
          OPENAI_REQUEST_TIMEOUT_SECONDS: "120"
        run: |
          python src/run_batched_league_copy.py data/history.json \
            --checkpoint-dir "../production/.automation/ai-checkpoints/league" \
            --batch-size 6

      - name: Persist validated league AI checkpoints
        if: always() && steps.change.outputs.rebuild == 'true'
        working-directory: production
        env:
          LATEST: ${{ steps.change.outputs.latest }}
        run: |
          CHECKPOINT_DIR=".automation/ai-checkpoints/league"
          if [ ! -d "$CHECKPOINT_DIR" ]; then
            echo "No validated league checkpoints to persist."
            exit 0
          fi
          git config user.name "high-loft-auto-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$CHECKPOINT_DIR"
          if git diff --cached --quiet; then
            echo "No new league checkpoints to persist."
            exit 0
          fi
          git commit -m "Checkpoint AI league generation for SGT $LATEST"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Write queued tournament recaps with as-of-event history
        if: steps.change.outputs.rebuild == 'true'
        working-directory: engine
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.4-mini-2026-03-17
          OPENAI_FALLBACK_MODEL: gpt-5.6-luna
          OPENAI_TRANSIENT_ATTEMPTS: "6"
          OPENAI_REQUEST_TIMEOUT_SECONDS: "120"
          TARGETS: ${{ steps.change.outputs.targets }}
        run: |
          set -euo pipefail
          for EVENT_ID in $TARGETS; do
            echo "Generating queued recap for SGT $EVENT_ID"
            python src/run_batched_high_loft_recap.py "data/analysis/${EVENT_ID}.json" \
              --output "data/copy/${EVENT_ID}.json" \
              --facts-output "data/facts/${EVENT_ID}.json" \
              --checkpoint-dir "../production/.automation/ai-checkpoints/recap" \
              --batch-size 6
          done

      - name: Persist validated recap AI checkpoints
        if: always() && steps.change.outputs.rebuild == 'true'
        working-directory: production
        env:
          TARGETS: ${{ steps.change.outputs.targets }}
        run: |
          CHECKPOINT_DIR=".automation/ai-checkpoints/recap"
          if [ ! -d "$CHECKPOINT_DIR" ]; then
            echo "No validated recap checkpoints to persist."
            exit 0
          fi
          git config user.name "high-loft-auto-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$CHECKPOINT_DIR"
          if git diff --cached --quiet; then
            echo "No new recap checkpoints to persist."
            exit 0
          fi
          git commit -m "Checkpoint AI recap generation for queued SGT events: $TARGETS"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Render High Loft production design
        if: steps.change.outputs.rebuild == 'true'
        working-directory: engine
        env:
          TARGETS: ${{ steps.change.outputs.targets }}
        run: |
          set -euo pipefail
          ARGS=()
          for EVENT_ID in $TARGETS; do
            ARGS+=(--recap-event-id "$EVENT_ID")
          done
          python src/render_high_loft_large_field.py --production-root ../production --output site-high-loft "${ARGS[@]}"

      - name: Validate High Loft build before publication
        if: steps.change.outputs.rebuild == 'true'
        env:
          TARGETS: ${{ steps.change.outputs.targets }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path('engine')
          site = root / 'site-high-loft'
          production = Path('production')
          history = json.loads((root / 'data/history.json').read_text())
          config = json.loads((root / 'config.json').read_text())
          latest = int(history['completedEvents'][0]['id'])
          targets = [int(x) for x in os.environ['TARGETS'].split()]

          assert (site / 'index.html').exists(), 'Missing landing page'
          recap_files = list((site / 'recaps').glob('*.html'))
          assert len(recap_files) == len(targets), f'Expected {len(targets)} queued recaps, got {len(recap_files)}'

          excluded = {int(x) for x in ((config.get('history') or {}).get('excludeEventIds') or [])}
          completed_ids = {int(e['id']) for e in history.get('completedEvents', [])}
          eligible_ids = {int(e['id']) for e in history.get('profileEligibleEvents', [])}
          all_scope_ids = {int(x) for x in history['scopes']['all']['eventIds']}
          expected_eligible = completed_ids - excluded

          assert not (excluded & eligible_ids), f'Excluded events leaked into profileEligibleEvents: {excluded & eligible_ids}'
          assert not (excluded & all_scope_ids), f'Excluded events leaked into All Data profiles: {excluded & all_scope_ids}'
          assert eligible_ids == expected_eligible, f'Profile eligibility mismatch. Expected {sorted(expected_eligible)}, got {sorted(eligible_ids)}'
          assert history['defaultScope'] == str((config.get('history') or {}).get('defaultScope', history['defaultScope']))

          landing = (site / 'index.html').read_text()
          for required in (
              'assets/site.css', 'assets/landing-v2.css', 'League Snapshot', 'Scouting files',
              'Last 5', 'Last 10', 'Last 20', 'Tournament archive', 'data-profile-search',
              'data-profile-more', 'data-season-scroll-note', 'data-archive-more'
          ):
              assert required.lower() in landing.lower(), f'Missing landing requirement: {required}'

          for recap_file in recap_files:
              recap = recap_file.read_text()
              for required in (
                  'assets/recap-v2.css', 'Tournament leaderboard', 'data-board="net"', 'data-board="gross"',
                  'Carnage Board', 'Player by player', 'State of the league', 'data-round-player-search',
                  'data-round-player-more', 'data-carnage-more'
              ):
                  assert required.lower() in recap.lower(), f'{recap_file.name}: missing recap requirement: {required}'

          historical = [
              'bay-hill.html', 'tpc-sawgrass.html', 'alpine-valley.html', 'tobacco-road-major.html',
              'caledonia.html', 'copperhead-playoff.html', 'sage-valley-championship.html',
              'par-3-canyon-run-scratch-tournament.html'
          ]
          for filename in historical:
              assert (production / 'recaps' / filename).exists(), f'Missing frozen historical recap: {filename}'

          print('HIGH LOFT PRODUCTION-DESIGN VALIDATION PASSED')
          print('Latest completed event:', latest)
          print('Historical recaps frozen:', len(historical))
          print('Excluded profile events:', sorted(excluded))
          print('Profile-eligible events:', len(eligible_ids))
          PY

      - name: Apply validated landing page and queued recaps
        if: steps.change.outputs.rebuild == 'true'
        env:
          TARGETS: ${{ steps.change.outputs.targets }}
          MISSING: ${{ steps.change.outputs.missing }}
          LATEST: ${{ steps.change.outputs.latest }}
        run: |
          set -euo pipefail
          cp engine/site-high-loft/index.html production/index.html
          mkdir -p production/recaps production/.automation
          cp engine/site-high-loft/recaps/*.html production/recaps/
          rm -rf "production/.automation/ai-checkpoints/league"
          for EVENT_ID in $TARGETS; do
            rm -rf "production/.automation/ai-checkpoints/recap/$EVENT_ID"
          done
          for EVENT_ID in $MISSING; do
            python engine/src/event_queue.py mark engine/data/history.json \
              --state production/.automation/published-events.json \
              --event "$EVENT_ID" >/dev/null
          done
          printf '%s\n' "$LATEST" > production/.automation/last-published-event.txt

      - name: Commit production publication
        id: publish
        if: steps.change.outputs.rebuild == 'true'
        working-directory: production
        env:
          TARGETS: ${{ steps.change.outputs.targets }}
        run: |
          git config user.name "high-loft-auto-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html recaps/ .automation/
          if git diff --cached --quiet; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "Validated build produced no file changes."
            exit 0
          fi
          git commit -m "Automated High Loft site update for queued SGT events: $TARGETS"
          git push origin HEAD:main
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Post newly published tournament recaps to Discord
        if: steps.publish.outputs.published == 'true' && steps.change.outputs.missing != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NEW_EVENTS: ${{ steps.change.outputs.missing }}
        working-directory: engine
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL is not configured; site published successfully and Discord was skipped."
            exit 0
          fi
          sleep 30
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          import urllib.request
          from pathlib import Path

          webhook = os.environ['DISCORD_WEBHOOK_URL']
          new_events = [int(x) for x in os.environ['NEW_EVENTS'].split()]
          history = json.loads(Path('data/history.json').read_text())
          cfg = json.loads(Path('config.json').read_text())
          by_id = {int(e['id']): e for e in history['completedEvents']}
          total_posts = 0

          for event_id in new_events:
              if event_id == 59463:
                  print(f"Skipping Discord for configured special event {event_id}")
                  continue
              event = by_id[event_id]
              mapped = ((cfg.get('site') or {}).get('recapSlugs') or {}).get(str(event_id))
              slug = mapped or re.sub(r'[^a-z0-9]+', '-', (event.get('tourName') or event.get('name') or f'event-{event_id}').lower()).strip('-')
              recap_url = f'https://bpgpitt10.github.io/high-loft-low-standards/recaps/{slug}.html'

              cmd = [
                  'python', 'src/build_discord_payload.py',
                  f'data/analysis/{event_id}.json',
                  f'data/copy/{event_id}.json',
                  '--recap-url', recap_url,
                  '--output', 'data/discord-payload.json',
              ]
              raw = Path(f'data/work/tournaments/{event_id}.json')
              if raw.exists():
                  cmd.extend(['--raw', str(raw)])
              subprocess.run(cmd, check=True)
              payload = json.loads(Path('data/discord-payload.json').read_text())

              for message in payload['messages']:
                  body = json.dumps({'content': message}).encode('utf-8')
                  req = urllib.request.Request(
                      webhook,
                      data=body,
                      headers={'Content-Type': 'application/json', 'User-Agent': 'high-loft-auto-bot'},
                  )
                  with urllib.request.urlopen(req, timeout=20) as response:
                      if response.status not in (200, 204):
                          raise RuntimeError(f'Discord webhook returned HTTP {response.status}')
                  total_posts += 1
              print(f"Posted Discord recap for SGT {event_id}; character counts={payload.get('characterCounts')}")

          print(f"Posted {total_posts} total Discord message(s) across {len(new_events)} newly published event(s)")
          PY

      - name: Summary
        run: |
          echo "Latest SGT event: ${{ steps.change.outputs.latest }}"
          echo "Missing publication queue: ${{ steps.change.outputs.missing }}"
          echo "Recap targets this run: ${{ steps.change.outputs.targets }}"
          echo "Rebuilt: ${{ steps.change.outputs.rebuild }}"
          echo "Production published: ${{ steps.publish.outputs.published }}"
          echo "Primary AI model: gpt-5.4-mini-2026-03-17"
          echo "Emergency fallback: gpt-5.6-luna"
          echo "League AI: resumable validated profile batches of 6 with persisted checkpoints"
          echo "Recap AI: resumable validated batches of 6 with persisted checkpoints"
          echo "Renderer: scalable large-field UI"
          echo "Target branch: main"
          echo "Historical tournament recaps are frozen and not regenerated."
