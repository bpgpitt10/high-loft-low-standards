name: GPT-5.4 mini smoke test

# Isolated manual integration test. Does not build, publish, or post to Discord.
on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5.4-mini-2026-03-17
      OPENAI_FALLBACK_MODEL: gpt-5.6-luna
      OPENAI_TRANSIENT_ATTEMPTS: "6"
      OPENAI_REQUEST_TIMEOUT_SECONDS: "120"

    steps:
      - name: Check out current recap engine
        uses: actions/checkout@v4
        with:
          repository: bpgpitt10/sgt-recap-engine-lab
          ref: main
          path: engine

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install engine dependencies
        run: python -m pip install -r engine/requirements.txt

      - name: Require existing OpenAI API key
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY is missing from repository secrets."
            exit 1
          fi

      - name: Tiny structured-output availability call
        run: |
          python - <<'PY'
          import json
          from openai import OpenAI

          model = "gpt-5.4-mini-2026-03-17"
          schema = {
              "type": "object",
              "additionalProperties": False,
              "properties": {
                  "ok": {"type": "boolean"},
                  "message": {"type": "string"},
              },
              "required": ["ok", "message"],
          }
          client = OpenAI(timeout=60.0, max_retries=0)
          response = client.responses.create(
              model=model,
              reasoning={"effort": "low"},
              instructions="Return the requested JSON only. This is an API availability smoke test.",
              input="Set ok=true and message='High Loft GPT-5.4 mini smoke test passed'.",
              text={"format": {"type": "json_schema", "name": "high_loft_smoke_test", "schema": schema, "strict": True}},
          )
          payload = json.loads(response.output_text)
          assert payload.get("ok") is True, payload
          print("GPT-5.4 MINI API SMOKE TEST PASSED")
          print("Response model:", getattr(response, "model", None))
          print("Usage:", getattr(response, "usage", None))
          PY

      - name: Rebuild deterministic High Loft history
        working-directory: engine
        run: python src/process_tour.py

      - name: Run real latest recap writer without publishing
        working-directory: engine
        run: |
          LATEST=$(python - <<'PY'
          import json
          from pathlib import Path
          h = json.loads(Path('data/history.json').read_text())
          print(h['completedEvents'][0]['id'])
          PY
          )
          echo "Testing latest completed event: $LATEST"
          python src/run_resilient_high_loft_recap.py "data/analysis/${LATEST}.json" \
            --output data/experiments/smoke-high-loft-recap.json \
            --facts-output data/experiments/smoke-high-loft-facts.json
          python - <<'PY'
          import json
          from pathlib import Path
          copy = json.loads(Path('data/experiments/smoke-high-loft-recap.json').read_text())
          print('Validated recap players:', len(copy['players']))
          print('Validated Carnage entries:', len(copy['carnage']))
          print('Teaser:', copy['latestTournamentTeaser'])
          PY

      - name: Run real league-copy writer without publishing
        working-directory: engine
        run: |
          python src/run_resilient_league_copy.py data/history.json \
            --output data/experiments/smoke-high-loft-league-copy.json \
            --facts-output data/experiments/smoke-high-loft-league-facts.json
          python - <<'PY'
          import json
          from pathlib import Path
          copy = json.loads(Path('data/experiments/smoke-high-loft-league-copy.json').read_text())
          print('Validated league scopes:', copy['availableScopes'])
          for scope_name, scope in copy['scopes'].items():
              print(scope_name, 'profiles=', len(scope['profiles']))
          PY

      - name: Integration test summary
        run: |
          echo "GPT-5.4 mini primary writer test passed."
          echo "Emergency fallback is configured as gpt-5.6-luna."
          echo "No production files were written by this workflow."
