name: AI checkpoint cross-run smoke

on:
  push:
    branches: [batched-ai-persistence-v1]
    paths:
      - ".github/workflows/checkpoint-cross-run-smoke.yml"

permissions:
  contents: write

jobs:
  create-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out production feature branch
        uses: actions/checkout@v4
        with:
          ref: batched-ai-persistence-v1
          fetch-depth: 0
      - name: Check out engine feature branch
        uses: actions/checkout@v4
        with:
          repository: bpgpitt10/sgt-recap-engine-lab
          ref: batched-ai-checkpoints-v1
          path: engine
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install engine dependencies
        run: python -m pip install -r engine/requirements.txt
      - name: Generate exactly one validated recap batch
        working-directory: engine
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.4-mini-2026-03-17
          OPENAI_FALLBACK_MODEL: gpt-5.6-luna
          OPENAI_TRANSIENT_ATTEMPTS: "6"
          OPENAI_REQUEST_TIMEOUT_SECONDS: "120"
        run: |
          test -n "$OPENAI_API_KEY"
          rm -rf ../.automation/test-ai-checkpoints
          set +e
          python src/run_batched_high_loft_recap.py data/analysis/55704.json \
            --checkpoint-dir ../.automation/test-ai-checkpoints/recap \
            --output data/test-cross-run-copy.json \
            --batch-size 3 \
            --max-new-batches 1
          status=$?
          set -e
          test "$status" -ne 0
          test -f ../.automation/test-ai-checkpoints/recap/55704/batch-001.json
          test ! -f ../.automation/test-ai-checkpoints/recap/55704/batch-002.json
      - name: Commit checkpoint only
        run: |
          git config user.name "high-loft-auto-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .automation/test-ai-checkpoints/
          git commit -m "Test persisted AI checkpoint"
          git push origin HEAD:batched-ai-persistence-v1

  fresh-run-resume:
    needs: create-checkpoint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Fresh checkout containing persisted checkpoint
        uses: actions/checkout@v4
        with:
          ref: batched-ai-persistence-v1
          fetch-depth: 0
      - name: Check out engine feature branch
        uses: actions/checkout@v4
        with:
          repository: bpgpitt10/sgt-recap-engine-lab
          ref: batched-ai-checkpoints-v1
          path: engine
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install engine dependencies
        run: python -m pip install -r engine/requirements.txt
      - name: Resume from prior runner checkpoint
        working-directory: engine
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.4-mini-2026-03-17
          OPENAI_FALLBACK_MODEL: gpt-5.6-luna
          OPENAI_TRANSIENT_ATTEMPTS: "6"
          OPENAI_REQUEST_TIMEOUT_SECONDS: "120"
        run: |
          test -f ../.automation/test-ai-checkpoints/recap/55704/batch-001.json
          python src/run_batched_high_loft_recap.py data/analysis/55704.json \
            --checkpoint-dir ../.automation/test-ai-checkpoints/recap \
            --output data/test-cross-run-copy.json \
            --batch-size 3
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('../.automation/test-ai-checkpoints/recap/55704/manifest.json').read_text())
          copy=json.loads(Path('data/test-cross-run-copy.json').read_text())
          assert manifest['complete'] is True, manifest
          assert manifest['reusedBatches'] == 1, manifest
          assert manifest['newBatches'] == 2, manifest
          assert len(copy['players']) == 8
          print('CROSS-RUN RESUME PASS', json.dumps(manifest, indent=2))
          PY
