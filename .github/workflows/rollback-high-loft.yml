name: Restore Canyon Run production history

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rollback-high-loft.yml"

concurrency:
  group: high-loft-site-rollback
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out production
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore last known-good Canyon Run landing page
        run: |
          git config user.name "high-loft-auto-bot"
          git config user.email "actions@users.noreply.github.com"

          # 66609cde is the last verified production state with SGT 66943
          # present as the Aug 20 latest tournament and in rolling history.
          git show 66609cde033e4517b359cc32e5dae729fb5dfcf3:index.html > index.html
          mkdir -p .automation
          printf '%s\n' '66943' > .automation/last-published-event.txt

          grep -q 'Par 3 Canyon Run Scratch Tournament' index.html
          grep -q '"id": 66943' index.html
          test -f recaps/par-3-canyon-run-scratch-tournament.html

          git add index.html .automation/last-published-event.txt
          if git diff --cached --quiet; then
            echo "Production already matches the Canyon Run build."
            exit 0
          fi
          git commit -m "Restore Canyon Run as latest completed tournament"
          git push origin HEAD:main

      - name: Summary
        run: |
          echo "Canyon Run (SGT 66943) restored to Latest, archive, and rolling player history."
          echo "Published-event marker restored to 66943."
