name: Fix mobile profile spacing

on:
  push:
    paths:
      - ".github/workflows/fix-mobile-profile-gap.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch mobile scouting search sizing
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('assets/landing-v2.css')
          text = path.read_text()
          marker = '/* Mobile scouting search: flex-basis must not become vertical height. */'
          rule = '''\n/* Mobile scouting search: flex-basis must not become vertical height. */\n@media(max-width:820px){.scouting-head .scouting-player-search{flex:0 0 auto!important;width:100%!important;max-width:none!important;min-width:0!important;align-self:stretch}.scouting-meta{width:100%}}\n'''
          if marker not in text:
              text += rule
              path.write_text(text)
          assert marker in path.read_text()
          print('Mobile scouting search override present')
          PY
      - name: Commit live CSS fix
        run: |
          git config user.name "high-loft-auto-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/landing-v2.css
          if git diff --cached --quiet; then
            echo "Already fixed"
            exit 0
          fi
          git commit -m "Fix mobile player profile spacing"
          git pull --rebase origin main
          git push origin HEAD:main
