# retry with real-input validation
name: One-time published recap search header patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recap-search-header-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch existing recap pages
        run: python tools/patch_recap_search_headers.py
      - name: Validate recap search headers
        run: |
          python -m py_compile tools/patch_recap_search_headers.py
          grep -R -q '<input[^>]*data-carnage-search' recaps
          grep -R -q '<input[^>]*data-round-player-search' recaps
          grep -R -q 'recap-header-search-runtime' recaps
      - name: Publish recap UI update
        run: |
          git config user.name "high-loft-ui-bot"
          git config user.email "actions@users.noreply.github.com"
          git add recaps/
          git commit -m "Move player search into tournament section headers"
          git push origin HEAD:main
