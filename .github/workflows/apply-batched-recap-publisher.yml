name: Apply batched recap publisher

on:
  push:
    branches: [batched-ai-persistence-v1]
    paths:
      - ".github/workflows/apply-batched-recap-publisher.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: batched-ai-persistence-v1
          fetch-depth: 0

      - name: Patch production publisher
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/high-loft-auto.yml')
          text = path.read_text()
          latest_expr = '$' + '{{ steps.change.outputs.latest }}'

          old = '''        run: python src/run_resilient_high_loft_recap.py "data/analysis/${LATEST}.json" --output "data/copy/${LATEST}.json" --facts-output "data/facts/${LATEST}.json"\n\n      - name: Render High Loft production design\n'''
          new = f'''        run: |\n          python src/run_batched_high_loft_recap.py "data/analysis/${{LATEST}}.json" \\\n            --output "data/copy/${{LATEST}}.json" \\\n            --facts-output "data/facts/${{LATEST}}.json" \\\n            --checkpoint-dir "../production/.automation/ai-checkpoints/recap" \\\n            --batch-size 6\n\n      - name: Persist validated recap AI checkpoints\n        if: always() && steps.change.outputs.rebuild == 'true'\n        working-directory: production\n        env:\n          LATEST: {latest_expr}\n        run: |\n          CHECKPOINT_DIR=".automation/ai-checkpoints/recap/$LATEST"\n          if [ ! -d "$CHECKPOINT_DIR" ]; then\n            echo "No validated recap checkpoints to persist."\n            exit 0\n          fi\n          git config user.name "high-loft-auto-bot"\n          git config user.email "actions@users.noreply.github.com"\n          git add "$CHECKPOINT_DIR"\n          if git diff --cached --quiet; then\n            echo "No new recap checkpoints to persist."\n            exit 0\n          fi\n          git commit -m "Checkpoint AI recap generation for SGT $LATEST"\n          git push origin HEAD:main\n\n      - name: Render High Loft production design\n'''
          if old not in text:
              raise SystemExit('Could not find recap-generation block')
          text = text.replace(old, new, 1)

          old = (
              "          cp engine/site-high-loft/recaps/*.html production/recaps/\n"
              + "          printf '%s\\n' '" + latest_expr + "' > production/.automation/last-published-event.txt\n"
          )
          new = (
              "          cp engine/site-high-loft/recaps/*.html production/recaps/\n"
              + "          rm -rf \"production/.automation/ai-checkpoints/recap/" + latest_expr + "\"\n"
              + "          printf '%s\\n' '" + latest_expr + "' > production/.automation/last-published-event.txt\n"
          )
          if old not in text:
              raise SystemExit('Could not find validated-apply block')
          text = text.replace(old, new, 1)

          old = '''          echo "Emergency fallback: gpt-5.6-luna"\n          echo "Renderer: scalable large-field UI"\n'''
          new = '''          echo "Emergency fallback: gpt-5.6-luna"\n          echo "Recap AI: resumable validated batches of 6 with persisted checkpoints"\n          echo "Renderer: scalable large-field UI"\n'''
          if old not in text:
              raise SystemExit('Could not find summary block')
          text = text.replace(old, new, 1)

          path.write_text(text)
          print('Patched High Loft publisher for resumable batched recap generation')
          PY

      - name: Static workflow assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/high-loft-auto.yml').read_text()
          latest_expr = '$' + '{{ steps.change.outputs.latest }}'
          required = [
              'src/run_batched_high_loft_recap.py',
              '--checkpoint-dir "../production/.automation/ai-checkpoints/recap"',
              '--batch-size 6',
              'Persist validated recap AI checkpoints',
              "if: always() && steps.change.outputs.rebuild == 'true'",
              'git add "$CHECKPOINT_DIR"',
              'Checkpoint AI recap generation for SGT $LATEST',
              'rm -rf "production/.automation/ai-checkpoints/recap/' + latest_expr + '"',
              'resumable validated batches of 6 with persisted checkpoints',
          ]
          missing = [item for item in required if item not in text]
          assert not missing, missing
          assert 'run_resilient_high_loft_recap.py' not in text
          print('STATIC PUBLISHER ASSERTIONS PASSED')
          PY

      - name: Commit publisher change
        run: |
          git config user.name "high-loft-auto-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/high-loft-auto.yml
          git commit -m "Use resumable batched recap generation"
          git pull --rebase origin batched-ai-persistence-v1
          git push origin HEAD:batched-ai-persistence-v1
